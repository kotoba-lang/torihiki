[package]
name = "torihiki-engine"
version = "0.1.0"
edition = "2021"
description = "Stage-1 single-threaded matching engine for torihiki (AWAI-3556)"
license = "Apache-2.0"

[lib]
name = "torihiki_engine"
path = "src/lib.rs"

[dependencies]
sha2 = "=0.11.1"
ed25519-dalek = "=3.0.0"
rustc_version = "=0.4.1"

[dev-dependencies]
proptest = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
