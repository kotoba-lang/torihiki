# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
model:
  max_tokens: 8192
  provider: murakumo
  default: mishima
  base_url: https://api.murakumo.cloud/v1
providers:
  murakumo:
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
web:
  backend: nous
browser:
  cloud_provider: nous
context_file_max_chars: 120000
auxiliary:
  free_only: true
  vision:
    reasoning_effort: none
  web_extract: {}
  compression:
    reasoning_effort: none
  skills_hub: {}
  approval: {}
  mcp: {}
  title_generation:
    reasoning_effort: none
  triage_specifier: {}
dashboard:
  turn_isolation: true
tts:
  provider: nous
wake_word:
  enabled: false
moa:
  presets:
    default:
      reference_models:
        - provider: murakumo
          model: mishima
          enabled: true
          base_url: https://api.murakumo.cloud/v1
          key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
      aggregator:
        provider: murakumo
        model: mishima
        base_url: https://api.murakumo.cloud/v1
        key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: murakumo
      model: mishima
      enabled: true
      base_url: https://api.murakumo.cloud/v1
      key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  aggregator:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
plugins:
  enabled: []
gateway:
  cron_only: true
  multiplex_profiles: true
_config_version: 51
image_gen:
  provider: nous
agent:
  max_turns: 500
  run_budget_seconds: 600
cron:
  max_parallel_jobs: 12
mcp_servers:
  github-forest:
    command: /opt/homebrew/bin/node
    args:
      - ~/github/com-junkawasaki/west-manifest/scripts/forest-maintenance.mjs
      - mcp
    lazy: true
